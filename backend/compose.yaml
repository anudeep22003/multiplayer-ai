services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conman
      POSTGRES_PASSWORD: conman
      POSTGRES_DB: conman
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conman -d conman"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
